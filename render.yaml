services:
  - type: web
    name: mj-d-d-2024
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: RULE_ENGINE_URL
        sync: false
      - key: RULE_ENGINE_API_KEY
        sync: false
